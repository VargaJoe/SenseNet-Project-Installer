name: Plot Manager tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run runtime regression tests
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1
