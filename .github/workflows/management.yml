name: Shared management UI
on:
  # Deliberately manual: repository Actions quota is owner-controlled.
  # Local scripts below remain usable without any GitHub runner allowance.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            name: windows
          - os: ubuntu-24.04
            runtime: linux-x64
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            src/Management/Web/package-lock.json
            src/Desktop/package-lock.json
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native engine regression (PowerShell 7)
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Native engine regression (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - name: Retained Windows launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/Run-GuiSmoke.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File ./tests/Run-GuiSmoke.ps1
          exit $LASTEXITCODE
      - name: Frontend build and tests
        working-directory: src/Management/Web
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Browser test runtime
        working-directory: src/Management/Web
        shell: pwsh
        run: |
          npx playwright install --with-deps chromium
          exit $LASTEXITCODE
      - name: Backend and real browser end-to-end tests
        shell: pwsh
        run: |
          dotnet build src/Management/Server/PlotManager.Server.csproj --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/management/Test-Management.ps1 -SkipBuild
      - name: Build installable desktop and portable local service
        shell: pwsh
        run: ./scripts/management/Build-Management.ps1 -Runtime '${{ matrix.runtime }}' -Desktop -SkipWebInstall
      - name: Upload unsigned development installers
        uses: actions/upload-artifact@v4
        with:
          name: plot-manager-${{ matrix.name }}-development
          path: |
            src/Desktop/src-tauri/target/release/bundle/nsis/*.exe
            src/Desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload portable service and bundled engine
        uses: actions/upload-artifact@v4
        with:
          name: plot-manager-service-${{ matrix.runtime }}
          path: artifacts/management/${{ matrix.runtime }}/
          if-no-files-found: error
      - name: Native Windows desktop execution smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem ./src/Desktop/src-tauri/target/release/bundle/nsis/*.exe)[0]
          ./scripts/management/Test-InstalledDesktop.ps1 -Installer $installer.FullName -ExpectedPayloadRoot ./artifacts/management/win-x64
      - name: Native Linux desktop execution smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(src/Desktop/src-tauri/target/release/bundle/deb/*.deb)
          sudo apt-get install -y "./${packages[0]}"
          trap 'sudo dpkg --remove plot-manager' EXIT
          xvfb-run -a dbus-run-session -- pwsh -NoProfile -File ./scripts/management/Test-DesktopSmoke.ps1 -Executable /usr/bin/plot-manager
      - name: Upload native execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: plot-manager-desktop-execution-${{ matrix.name }}
          path: artifacts/management/desktop-smoke-*.json
          if-no-files-found: error
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.name }}
          path: |
            src/Management/Web/test-results/
            src/Management/Web/playwright-report/
          if-no-files-found: ignore
