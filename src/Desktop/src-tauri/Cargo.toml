[package]
name = "plot-manager"
version = "0.1.0"
description = "Plot Manager desktop host"
authors = ["Plot Manager contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
